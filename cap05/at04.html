<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição - Semana de Tecnologia IFAL</title>
</head>
<body>

    <h1>Inscrição - Semana de Tecnologia IFAL</h1>

    <form action="https://httpbin.org/post"
          method="post"
          enctype="multipart/form-data">

        <!-- Campo oculto -->
        <input type="hidden" name="edicao" value="2026">

        <fieldset>
            <legend>Identificação do participante</legend>

            <label for="nome">Nome completo *</label><br>
            <input
                type="text"
                id="nome"
                name="nome"
                required>
            <br><br>

            <label for="email">E-mail institucional *</label><br>
            <input
                type="email"
                id="email"
                name="email"
                required>
            <br><br>

            <label for="cidade">Cidade de origem</label><br>
            <input
                type="text"
                id="cidade"
                name="cidade"
                list="cidades">

            <datalist id="cidades">
                <option value="Maceió">
                <option value="Arapiraca">
                <option value="Rio Largo">
                <option value="Palmeira dos Índios">
                <option value="Penedo">
                <option value="União dos Palmares">
                <option value="Delmiro Gouveia">
                <option value="São Miguel dos Campos">
            </datalist>

            <br><br>

            <label for="foto">Foto para crachá</label><br>
            <input
                type="file"
                id="foto"
                name="foto"
                accept="image/jpeg,image/png"
                aria-describedby="ajuda-foto">

            <br>
            <small id="ajuda-foto">
                Formatos aceitos: JPG e PNG. Tamanho máximo: 2 MB.
            </small>

        </fieldset>

        <br>

        <fieldset>
            <legend>Preferências para o evento</legend>

            <label for="chegada">Data e hora preferida para chegada</label><br>
            <input
                type="datetime-local"
                id="chegada"
                name="chegada">

            <br><br>

            <label for="experiencia">
                Nível de experiência:
                <span id="valor-experiencia">5</span>/10
            </label><br>

            <input
                type="range"
                id="experiencia"
                name="experiencia"
                min="0"
                max="10"
                step="1"
                value="5"
                oninput="document.getElementById('valor-experiencia').textContent = this.value">

            <br><br>

            <label for="cor_camiseta">Cor de preferência para a camiseta</label><br>
            <input
                type="color"
                id="cor_camiseta"
                name="cor_camiseta"
                value="#1a73e8">

            <br><br>

            <label for="oficinas">Oficinas de interesse</label><br>

            <select
                id="oficinas"
                name="oficinas[]"
                multiple
                size="4"
                aria-describedby="ajuda-oficinas">

                <option value="Desenvolvimento Web">
                    Desenvolvimento Web
                </option>
                <option value="Inteligência Artificial">
                    Inteligência Artificial
                </option>
                <option value="Banco de Dados">
                    Banco de Dados
                </option>
                <option value="Segurança da Informação">
                    Segurança da Informação
                </option>
                <option value="Computação em Nuvem">
                    Computação em Nuvem
                </option>
            </select>

            <br>

            <small id="ajuda-oficinas">
                Use Ctrl (ou Cmd no Mac) para selecionar mais de uma oficina.
            </small>

        </fieldset>

        <br>

        <button type="submit">Confirmar inscrição</button>

    </form>

</body>
</html>
